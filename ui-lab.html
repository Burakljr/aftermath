<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#F3E3C8">
<title>Heroes' Diner UI lab</title>
<link rel="stylesheet" href="css/app.css">
<style>
  /* Static placeholder where the 3D restaurant will be (UI lab only). */
  #stage { position: fixed; inset: 0; overflow: hidden; touch-action: none; background: #E9D2AE; }
  #stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .dot { position: absolute; left: 0; top: 0; width: 20px; height: 20px; margin: -10px 0 0 -10px; border-radius: 50%; will-change: transform; box-shadow: 0 3px 0 rgba(0,0,0,.18); }
  .dot::after { content: ''; position: absolute; left: 4px; top: -9px; width: 12px; height: 12px; border-radius: 50%; background: #F6CFA8; }
  .dot.cook { background: #fff; }
  .dot.cook::before { content: ''; position: absolute; left: 2px; top: -17px; width: 16px; height: 10px; border-radius: 6px 6px 2px 2px; background: #fff; z-index: 1; }
  .lab-tag { position: fixed; left: 6px; bottom: 2px; font: 600 10px system-ui; color: #a2702a; z-index: 1; opacity: .7; }
</style>
</head>
<body>
<div id="stage"><canvas id="bg"></canvas></div>
<div id="ui"></div>
<div class="lab-tag">UI lab: placeholder scene</div>
<script type="module">
import { createGame, EVENTS } from './js/game/index.js';
import { getLayout } from './js/game/layout.js';
import { createUI } from './js/ui/index.js';
import { createAudio } from './js/audio.js';

let params;
try { params = new URLSearchParams(location.search); } catch { params = new URLSearchParams(''); }

// ---------------------------------------------------------------- fake scene (scene API)
// A flat top-down drawing of js/game/layout.js with dots for guests and cooks, so every
// anchor the UI needs exists and moves like in the real game.
function createFakeScene(stage, game) {
  const canvas = stage.querySelector('canvas');
  const g2 = canvas.getContext('2d');
  let layout = getLayout(game.state.location);
  let quality = 'high';
  const dots = new Map();
  const tmp = [0, 0];
  let W = 0, H = 0, sx = 1, ox = 0, oy = 0, sz = 1;
  const COLORS = ['#5B8DEF', '#B06BE0', '#4BAE7A', '#E0884B'];

  function fit() {
    W = window.innerWidth; H = window.innerHeight;
    const b = layout.bounds;
    const top = 104, bottom = 178;
    sx = Math.min((W - 24) / (b.maxX - b.minX), 40);
    sz = (H - top - bottom) / (b.maxZ - b.minZ);
    ox = W / 2 - ((b.minX + b.maxX) / 2) * sx;
    oy = top - b.minZ * sz;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
    g2.setTransform(dpr, 0, 0, dpr, 0, 0);
    draw();
  }
  const px = (x) => ox + x * sx;
  const py = (z) => oy + z * sz;
  function rr(x, y, w, h, r, fill) { g2.beginPath(); g2.roundRect(x, y, w, h, r); g2.fillStyle = fill; g2.fill(); }
  function draw() {
    const harbor = layout.id === 'harbor';
    g2.fillStyle = harbor ? '#BFD9E2' : '#E9D2AE';
    g2.fillRect(0, 0, W, H);
    const b = layout.bounds;
    // floor
    rr(px(b.minX), py(b.minZ), (b.maxX - b.minX) * sx, (b.maxZ - b.minZ) * sz, 10, harbor ? '#D7E7EC' : '#F2DDBA');
    // kitchen tiles
    const kitchen = layout.kitchen || { maxZ: -5, pass: [] };
    g2.fillStyle = harbor ? '#C5DCE4' : '#E8D3B2';
    g2.fillRect(px(b.minX), py(b.minZ), (b.maxX - b.minX) * sx, (kitchen.maxZ - b.minZ) * sz);
    // back wall
    rr(px(b.minX), py(b.minZ) - 26, (b.maxX - b.minX) * sx, 30, 6, harbor ? '#7FA9BC' : '#C99A6A');
    // pass counters
    for (const p of kitchen.pass) rr(px(p.x0), py(p.z) - 6, (p.x1 - p.x0) * sx, 12, 4, '#B07A4E');
    // stations
    for (const st of layout.stations) rr(px(st.pos[0]) - 0.9 * sx, py(st.pos[1]) - 0.9 * sz, 1.8 * sx, 1.8 * sz, 8, '#9C9AA6');
    // tables
    layout.tables.forEach((t, i) => {
      const owned = game.state.tables[i] && game.state.tables[i].owned;
      g2.globalAlpha = owned ? 1 : 0.28;
      for (const s of t.seats) { g2.beginPath(); g2.arc(px(s.pos[0]), py(s.pos[1]), 0.36 * sx, 0, 7); g2.fillStyle = '#B07A4E'; g2.fill(); }
      g2.beginPath(); g2.ellipse(px(t.pos[0]), py(t.pos[1]), 0.75 * sx, 0.75 * sz, 0, 0, 7); g2.fillStyle = '#D9A36E'; g2.fill();
      g2.globalAlpha = 1;
    });
    // door
    rr(px(layout.door.pos[0]) - 1.1 * sx, py(b.maxZ) - 4, 2.2 * sx, 8, 3, '#8A5A36');
  }

  function dotFor(id, cls, color) {
    let d = dots.get(id);
    if (!d) {
      d = document.createElement('div');
      d.className = 'dot ' + cls;
      if (color) d.style.background = color;
      stage.appendChild(d);
      dots.set(id, d);
    }
    d._seen = frame;
    return d;
  }
  // world position of an entity (walk progress t / dur along the path)
  function pos(e) {
    if (e.from === e.to || !(e.dur > 0)) {
      const n = layout.graph.nodes[e.to];
      tmp[0] = n[0]; tmp[1] = n[1];
      return tmp;
    }
    return layout.pointAt(e.from, e.to, (e.t / e.dur) * layout.pathLength(e.from, e.to), tmp);
  }
  let frame = 0;
  const api = {
    setLocation(id) { layout = getLayout(id); for (const d of dots.values()) d.remove(); dots.clear(); fit(); },
    update(state) {
      frame++;
      for (const c of state.customers) {
        const p = pos(c);
        dotFor(c.id, 'guest', COLORS[c.look.tint % 4]).style.transform = `translate(${px(p[0])}px, ${py(p[1])}px)`;
      }
      for (const k of state.cooks) {
        const p = pos(k);
        dotFor(k.id, 'cook').style.transform = `translate(${px(p[0])}px, ${py(p[1])}px)`;
      }
      for (const [id, d] of dots) if (d._seen !== frame) { d.remove(); dots.delete(id); }
    },
    fx(ev) { if (ev === 'buyTable' || ev === 'locationStart') draw(); },
    pick(x, y) {
      let best = null; let bd = Infinity;
      const test = (type, id, X, Y, r) => { const d = Math.hypot(X - x, Y - y); if (d < r && d < bd) { bd = d; best = { type, id }; } };
      for (const st of layout.stations) test('station', st.id, px(st.pos[0]), py(st.pos[1]), 46);
      for (const c of game.state.customers) { const p = pos(c); test('customer', c.id, px(p[0]), py(p[1]) - 8, 20); }
      for (const k of game.state.cooks) { const p = pos(k); test('cook', k.id, px(p[0]), py(p[1]) - 8, 20); }
      for (const t of layout.tables) test('table', t.id, px(t.pos[0]), py(t.pos[1]), 34);
      return best;
    },
    anchor(kind, id) {
      // like the real scene: above an open station, lower (just above the plot) for closed ones
      if (kind === 'station') {
        const i = layout.stations.findIndex((s) => s.id === id);
        const st = layout.stations[i];
        if (!st) return null;
        const open = game.state.stations[i] && game.state.stations[i].open;
        return { x: px(st.pos[0]), y: py(st.pos[1]) + (open ? -0.9 * sz - 4 : 0.5 * sz), visible: true };
      }
      if (kind === 'table') { const t = layout.tables.find((s) => s.id === id); return t ? { x: px(t.pos[0]), y: py(t.pos[1]), visible: true } : null; }
      if (kind === 'customer' || kind === 'cook') {
        const e = (kind === 'customer' ? game.state.customers : game.state.cooks).find((c) => c.id === id);
        if (!e) return null;
        const p = pos(e);
        return { x: px(p[0]), y: py(p[1]) - 22, visible: true };
      }
      if (kind === 'coins') return { x: px(layout.door.pos[0]), y: py(layout.bounds.maxZ) - 20, visible: true };
      return null;
    },
    setQuality(q) { quality = q; },
    stats() { return { fps: 60, calls: 42, tris: 61234, quality }; },
    resize: fit,
  };
  window.addEventListener('resize', fit);
  fit();
  return api;
}

// ---------------------------------------------------------------- game + UI
const lang = params.get('lang') === 'tr' ? 'tr' : 'en';
let simMs = 1_000_000;
const game = createGame({ save: null, lang, now: () => simMs, seed: 7 });
const scene = createFakeScene(document.getElementById('stage'), game);
const audio = createAudio();
const ui = createUI({ root: document.getElementById('ui'), game, scene, audio, canvas: document.getElementById('stage') });
for (const ev of EVENTS) game.on(ev, (p) => scene.fx(ev, p));
game.on('locationStart', (p) => scene.setLocation(p.id));

const paused = params.get('paused') === '1';
function frame(dt) {
  simMs += dt * 1000;
  game.tick(dt);
  scene.update(game.state, dt);
  ui.update(dt);
}
function step(dt, h = 1 / 30) {
  let left = dt;
  while (left > 1e-9) { const d = Math.min(h, left); frame(d); left -= d; }
}
function buy(station, n) { for (let i = 0; i < n; i++) game.act({ type: 'upgrade', station }); }
function rich(fn) { game.state.money = 1e12; fn(); }

// presets for screenshots and tests
function applyPreset(p) {
  const s = game.state;
  const openAll = (k) => { for (let i = 0; i < k; i++) game.act({ type: 'open', station: i }); };
  switch (p) {
    case 'fresh': break;
    case 'card': step(3); ui.openCard('juice'); break;
    case 'poor': step(3); s.money = 2; ui.openCard('juice'); break;
    case 'milestone': rich(() => buy('juice', 8)); s.money = 400; step(2); ui.openCard('juice'); break;
    case 'tut1': step(2); ui.tapStation('juice'); break;
    case 'open': rich(() => buy('juice', 6)); s.money = 120; game.act({ type: 'tutorial', step: 2 }); step(6); break;
    case 'opencard': rich(() => buy('juice', 6)); s.money = 120; game.act({ type: 'tutorial', step: 2 }); step(4); ui.openCard('grill'); break;
    case 'busy':
      rich(() => { openAll(3); buy('juice', 14); buy('grill', 9); buy('stew', 4); game.act({ type: 'buyTable' }); game.act({ type: 'buyTable' }); game.act({ type: 'hire' }); game.act({ type: 'hire' }); });
      game.act({ type: 'tutorial', step: 'done' }); s.money = 2400; step(40); break;
    case 'collect': rich(() => buy('juice', 4)); s.money = 30; game.act({ type: 'tutorial', step: 'done' }); step(4); break;
    case 'upgrades':
      rich(() => { openAll(2); buy('juice', 11); buy('grill', 4); game.act({ type: 'buyTable' }); game.act({ type: 'hire' }); });
      game.act({ type: 'tutorial', step: 'done' }); s.money = 900; step(8); ui.openMenu('upgrades'); break;
    case 'goals': rich(() => { buy('juice', 4); game.act({ type: 'hire' }); }); s.money = 60; game.act({ type: 'tutorial', step: 'done' }); step(25); ui.openMenu('goals'); break;
    case 'places': game.act({ type: 'tutorial', step: 'done' }); step(3); ui.openMenu('places'); break;
    case 'complete': case 'placesdone': {
      rich(() => { openAll(4); for (let i = 0; i < 4; i++) buy(i, 29); for (let i = 0; i < 4; i++) game.act({ type: 'buyTable' }); while (s.cooks.length < 4) game.act({ type: 'hire' }); for (let i = 0; i < 4; i++) game.act({ type: 'cookSpeed' }); });
      s.served = Math.max(s.served, 400); game.act({ type: 'tutorial', step: 'done' }); step(1);
      for (let k = 0; k < 40; k++) { const v = game.select.goalViews().find((x) => x.done && !x.claimed); if (!v) break; game.act({ type: 'claimGoal', id: v.id }); }
      s.money = 123456; step(1);
      if (p === 'placesdone') { ui.debug.complete.dismiss(); ui.openMenu('places'); }
      break;
    }
    case 'harbor':
      game.state.complete = true; game.act({ type: 'nextLocation' }); game.act({ type: 'tutorial', step: 'done' });
      rich(() => { buy('cocoa', 9); game.act({ type: 'hire' }); game.act({ type: 'buyTable' }); }); s.money = 3200; step(20); break;
    case 'offline': {
      rich(() => { openAll(2); buy('juice', 12); buy('grill', 8); game.act({ type: 'hire' }); });
      game.act({ type: 'tutorial', step: 'done' }); s.money = 500; step(30);
      simMs += 95 * 60 * 1000; step(0.1); break;
    }
    case 'settings': step(2); ui.openSettings(); break;
    default: break;
  }
  ui.update(0);
}

window.diner = { game, ui, scene, audio, step, buy, applyPreset, ready: false };
applyPreset(params.get('state') || 'fresh');

let last = 0;
function loop(t) {
  requestAnimationFrame(loop);
  const dt = last ? Math.min(0.1, (t - last) / 1000) : 1 / 60;
  last = t;
  if (!paused) frame(dt);
}
if (paused) { scene.update(game.state, 0); ui.update(0); }
requestAnimationFrame(loop);
window.diner.ready = true;
</script>
</body>
</html>
