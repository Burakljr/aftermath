<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>ui-lab</title>
<link rel="preload" as="font" type="font/woff2" crossorigin href="assets/ui/fonts/archivo-latin-wdth-normal.woff2">
<link rel="preload" as="font" type="font/woff2" crossorigin href="assets/ui/fonts/archivo-latin-ext-wdth-normal.woff2">
<link rel="preload" as="font" type="font/woff2" crossorigin href="assets/ui/fonts/big-shoulders-display-latin-800-normal.woff2">
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/ui.css">
<link rel="stylesheet" href="css/game.css">
<style>
  html, body { margin: 0; height: 100%; background: #0b0d0e; overflow: hidden; }
  html.lab-safe { --safe-top: 47px; --safe-bottom: 34px; }
  #stage { position: relative; width: 100vw; height: 100vh; overflow: hidden; background: #101315; cursor: default; }
  @media (min-width: 641px) { #stage { width: 390px; height: 844px; margin: 24px auto; border-radius: 28px; box-shadow: 0 0 0 10px #1c2023, 0 30px 80px rgba(0,0,0,.6); } }
  #stage > #ui { position: absolute; inset: 0; }
  .lab-bg { position: absolute; left: 0; right: 0; top: -60px; bottom: -280px; background: #1a1e21 center top / cover no-repeat; will-change: transform; }
  .lab-bg.shake { animation: labshake 300ms linear; }
  @keyframes labshake { 25% { translate: -5px 2px; } 50% { translate: 4px -3px; } 75% { translate: -2px 2px; } }
  .lab-hl { position: absolute; inset: 0; pointer-events: none; }
  .lab-mark { position: absolute; left: 0; top: 0; width: 132px; height: 92px; margin: -46px 0 0 -66px; border-radius: 4px; opacity: 0; transition: opacity .2s; }
  .lab-mark.accept { opacity: 1; background: rgba(245,180,0,.10); box-shadow: inset 0 0 0 1.5px rgba(245,180,0,.55); }
  .lab-mark.sel { opacity: 1; background: rgba(245,180,0,.08); box-shadow: inset 0 0 0 2px #f5b400; }
  .lab-mark.pulse { opacity: 1; box-shadow: inset 0 0 0 2px #ff5a1f; animation: labpulse 1s infinite; }
  .lab-mark.spread { opacity: 1; box-shadow: inset 0 0 0 2px #ff3b1f; animation: labpulse .5s infinite; }
  @keyframes labpulse { 50% { opacity: .35; } }
  #labbar[hidden] { display: none; }
  #labbar { position: fixed; left: 12px; top: 12px; z-index: 99; display: flex; gap: 10px; align-items: center; font: 13px system-ui; color: #ccc; background: #1c2023; padding: 8px 10px; border-radius: 8px; }
</style>
</head>
<body>
<div id="labbar" hidden><select></select><label><input type="checkbox"> Canlı</label></div>
<div id="stage"><div id="ui"></div></div>
<script type="module" src="js/ui/lab/lab.js"></script>
</body>
</html>
