<script type="module">
// Contact sheet of assets/models (tools only, not shipped): ?mode=props|heroes&clip=Walking_A&t=0.3
import * as THREE from 'three';
import * as SkeletonUtils from 'three/addons/utils/SkeletonUtils.js';
import { loadModel } from '../../js/scene/assets.js';
const q = new URLSearchParams(location.search);
const mode = q.get('mode') || 'props';
const W = innerWidth, H = innerHeight;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, H); renderer.setPixelRatio(1);

document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color('#556');

const sun = new THREE.DirectionalLight('#fff2dd', 2.2); sun.position.set(-4, 10, 6); scene.add(sun);

const mixers = [];

  const s = Math.max(cols * sp, rows * sp) / 2 * 0.62;

  cam.position.set(cx, 40, cz + 34); cam.lookAt(cx, 0, cz);
} else {
  const anims = await loadModel('anims');
  const names = (q.get('heroes') || 'knight,mage,barbarian,barbarian_hat,rogue,rogue_hooded').split(',');
  const clips = (q.get('clips') || 'Idle').split(',');

  for (const clipName of clips) {
    for (const n of names) {

      if (clip) { mixer.clipAction(clip).play(); mixer.update(t * clip.duration); }
      mixers.push(mixer);

    }
  }
  const rows = Math.ceil(i / names.length);
  const cx = (names.length - 1) * 1.5, cz = (rows - 1) * 1.6;
  const s = Math.max(names.length * 3 * H / W, rows * 3.2) / 2 * 0.75;
  cam.left = -s * W / H; cam.right = s * W / H; cam.top = s; cam.bottom = -s;
  const yaw = Number(q.get('yaw') || 0) * Math.PI / 180, el = Number(q.get('el') || 30) * Math.PI / 180;
  cam.position.set(cx + Math.sin(yaw) * Math.cos(el) * 40, 1 + Math.sin(el) * 40, cz + Math.cos(yaw) * Math.cos(el) * 40); cam.lookAt(cx, 1, cz);

Object.assign(ctx.style, { position: 'absolute', left: 0, top: 0, pointerEvents: 'none' });
document.body.appendChild(ctx);
const c2 = ctx.getContext('2d'); c2.font = '11px sans-serif'; c2.fillStyle = '#fff'; c2.textAlign = 'center';

window.__ready = true;
</script>
