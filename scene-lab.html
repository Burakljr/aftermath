<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Heroes' Diner - scene lab</title>
<script type="importmap">
{ "imports": { "three": "./vendor/three/build/three.module.min.js", "three/addons/": "./vendor/three/addons/" } }
</script>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #9fc98f; touch-action: manipulation; }
  #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<script type="module">
import { createScene } from './js/scene/scene.js';
const q = new URLSearchParams(location.search);
const scene = await createScene(document.getElementById('scene'), {
  quality: q.get('quality') || 'high', preserveDrawingBuffer: true,
  elevation: q.has('el') ? Number(q.get('el')) : undefined, yaw: q.has('yaw') ? Number(q.get('yaw')) : undefined,
  location: q.get('loc') || 'inn',
});
const state = { location: q.get('loc') || 'inn' };
scene.update(state, 0);
window.lab = { scene, state };
window.__ready = true;
</script>
</body>
</html>
