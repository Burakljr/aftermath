<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0e1012">
<title>Aftermath - sahne laboratuvarı</title>
<link rel="stylesheet" href="./css/fonts.css">
<script type="importmap">
{ "imports": {
  "three": "./vendor/three/build/three.module.min.js",
  "three/addons/": "./vendor/three/addons/"
} }
</script>
<style>
  html, body { margin: 0; height: 100%; background: #0e1012; overflow: hidden; font: 12px/1.3 "Archivo", "Arial Narrow", sans-serif; color: #e8e6e0; }
  #scene { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; touch-action: none; }
  .band-top, .band-bot { position: fixed; left: 0; right: 0; background: rgba(14, 16, 18, 0.82); pointer-events: none; }
  .band-top { top: 0; height: 96px; border-bottom: 1px solid #2a2e33; }
  .band-bot { bottom: 0; height: 260px; border-top: 1px solid #2a2e33; }
  body.nohud .band-top, body.nohud .band-bot, body.nohud #panel, body.nohud #stats { display: none; }
  body.noui #panel, body.noui #stats { display: none; }
  #panel { position: fixed; left: 6px; right: 6px; bottom: 6px; max-height: 248px; overflow: auto; display: flex; flex-wrap: wrap; gap: 4px; }
  #panel button { min-height: 44px; min-width: 44px; padding: 0 8px; background: #1d2126; color: #e8e6e0; border: 1px solid #3a3f45; border-radius: 3px; font: inherit; }
  #panel button.on { background: #f5b400; color: #111; border-color: #f5b400; }
  #panel .sep { width: 100%; height: 0; }
  #stats { position: fixed; top: 6px; left: 6px; right: 6px; font: 11px/1.35 ui-monospace, Menlo, monospace; white-space: pre; color: #cfd3d6; pointer-events: none; }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div class="band-top"></div>
<div class="band-bot"></div>
<div id="stats"></div>
<div id="panel"></div>
<script type="module" src="./js/scene/lab/lab.js"></script>
</body>
</html>
