<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#F3E3C8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<title>Heroes' Diner</title>
<link rel="preload" href="assets/fonts/fredoka-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/fredoka-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/app.css">
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three/build/three.module.min.js",
    "three/addons/": "./vendor/three/addons/"
  }
}
</script>
<style>
  /* Loading screen: shown while the code and the 3D models load (about 2.6 MB), removed after
     the first frame. main.js fills in the title (in the player's language) and the progress. */
  #loader {
    position: fixed; inset: 0; z-index: 50;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    padding: env(safe-area-inset-top, 0px) 24px env(safe-area-inset-bottom, 0px);
    background: #F3E3C8; color: #4A3426;
    font-family: 'Fredoka', ui-rounded, system-ui, -apple-system, 'Segoe UI', sans-serif;
    transition: opacity .35s ease;
  }
  #loader.is-done { opacity: 0; pointer-events: none; }
  #loader .logo { width: 96px; height: 96px; animation: ld-bob 1.6s ease-in-out infinite; }
  #loader .logo svg { width: 100%; height: 100%; display: block; }
  #loader .name { min-height: 34px; margin: 0; font-size: 28px; font-weight: 700; letter-spacing: .2px; text-align: center; }
  #loader .track { width: 180px; height: 10px; border-radius: 99px; background: #EADBC4; overflow: hidden; }
  #loader .fill { width: 6%; height: 100%; border-radius: 99px; background: #FF8F2E; transition: width .3s ease; }
  @keyframes ld-bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
  @media (prefers-reduced-motion: reduce) { #loader .logo { animation: none; } }
  #fatal {
    position: fixed; left: 20px; right: 20px; top: 40%; z-index: 60;
    padding: 16px 18px; border-radius: 22px; background: #FFF9F0; color: #4A3426;
    font: 600 17px/1.35 'Fredoka', ui-rounded, system-ui, sans-serif; text-align: center;
    box-shadow: 0 6px 18px rgba(74, 44, 18, .16), 0 1px 3px rgba(74, 44, 18, .12);
    pointer-events: none;
  }
  #fatal[hidden] { display: none; }
</style>
</head>
<body>
<canvas id="scene" class="scene"></canvas>
<div id="ui"></div>
<div id="loader" aria-busy="true">
  <div class="logo"><svg viewBox="0 0 48 48" aria-hidden="true"><ellipse cx="24" cy="43" rx="17" ry="2.6" fill="#000" opacity=".12"/><path d="M9 21h30v21H9z" fill="#FFF3DF"/><path d="M4.6 23L24 7.6 43.4 23z" fill="#D9643A"/><path d="M4.6 23L24 7.6 26.4 9.4 9.6 23z" fill="#E8835A"/><rect x="20" y="29" width="8" height="13" rx="4" fill="#9A6A43"/><rect x="12" y="27" width="5.6" height="5.6" rx="1.4" fill="#8FCBEA"/><rect x="30.4" y="27" width="5.6" height="5.6" rx="1.4" fill="#8FCBEA"/><rect x="31" y="9" width="4.4" height="8" fill="#B88C66"/></svg></div>
  <h1 class="name"></h1>
  <div class="track" role="progressbar" aria-valuemin="0" aria-valuemax="100"><div class="fill"></div></div>
</div>
<div id="fatal" role="alert" hidden></div>
<script type="module" src="js/main.js"></script>
</body>
</html>
