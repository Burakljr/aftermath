<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0b0d0e">
  <meta name="color-scheme" content="dark">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Aftermath">
  <meta name="format-detection" content="telephone=no">
  <meta name="description" content="Canavar düştükten sonra şehri temizleyen şirketi yönet: söndür, enkazı kaldır, kes, sat.">
  <title>Aftermath</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preload" as="font" type="font/woff2" crossorigin href="assets/ui/fonts/archivo-latin-wdth-normal.woff2">
  <link rel="preload" as="font" type="font/woff2" crossorigin href="assets/ui/fonts/archivo-latin-ext-wdth-normal.woff2">
  <link rel="preload" as="font" type="font/woff2" crossorigin href="assets/ui/fonts/big-shoulders-display-latin-800-normal.woff2">
  <link rel="preload" as="font" type="font/woff2" crossorigin href="assets/ui/fonts/big-shoulders-stencil-display-latin-800-normal.woff2">
  <link rel="modulepreload" href="js/main.js">
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/ui.css">
  <link rel="stylesheet" href="css/game.css">
  <script type="importmap">
  { "imports": {
    "three": "./vendor/three/build/three.module.min.js",
    "three/addons/": "./vendor/three/addons/"
  } }
  </script>
  <style>
    html, body { margin: 0; height: 100%; background: #0b0d0e; overflow: hidden; overscroll-behavior: none;
      -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
    #scene { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; display: block; touch-action: none; background: #0b0d0e; }
    #ui { height: 100dvh; }
    /* static boot plate: paints before any script runs, then the UI veil (same look) replaces it */
    #boot { position: fixed; inset: 0; z-index: 50; }
    #boot .loading__bar i { animation: bootbar 1.6s ease-out forwards; }
    @keyframes bootbar { from { transform: scaleX(.04); } to { transform: scaleX(.3); } }
    #boot .loading__line.err { color: #ff8a5c; max-width: 300px; text-align: center; }
  </style>
</head>
<body>
  <canvas id="scene" aria-label="Körfezkent haritası"></canvas>
  <div id="ui"></div>
  <div id="boot" class="loading" role="status">
    <div class="loading__brand">AFTERMATH</div>
    <div class="loading__sub">Enkaz ve leş kaldırma</div>
    <div class="loading__bar"><i></i></div>
    <div class="loading__line">Saha hazırlanıyor</div>
  </div>
  <noscript><p style="position:fixed;inset:auto 0 40px;text-align:center;color:#a1a8a6;font:15px system-ui">Oyun için JavaScript açık olmalı.</p></noscript>
  <script type="module" src="js/main.js"></script>
</body>
</html>
